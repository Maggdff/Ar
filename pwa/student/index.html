<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حضوري"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<title>حضور الطالب</title>
<style>:root{--bg:#f4f6fa;--c:#fff;--t:#14202e;--p:#1565c0;--m:#6b7785}@media(prefers-color-scheme:dark){:root{--bg:#10151c;--c:#1b232d;--t:#e8eef5;--p:#64a7ff;--m:#93a1b1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:16px}.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0}h2{margin:.2em 0 .5em}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--m)}input{background:var(--c);color:var(--t);direction:ltr;text-align:center;letter-spacing:2px}
button{background:var(--p);color:#fff;border:0;margin-top:8px}button.s{background:var(--c);color:var(--p);border:1px solid var(--p)}.m{color:var(--m);font-size:.9em}.err{color:#d32f2f}.ok{color:#2e7d32}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--c);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--bg)}nav a{flex:1;text-align:center;padding:12px 4px;color:var(--m)}nav a.on{color:var(--p);font-weight:700}
video{width:100%;border-radius:12px;background:#000}#qr{display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px}#qr svg,#qr img{width:min(80vw,320px);height:auto}.row{display:flex;justify-content:space-between;gap:8px}</style></head>
<body><main id="app"></main><nav id="nav" hidden></nav>
<script src="../shared/vendor/jsQR.js"></script><script src="../shared/vendor/qrcode.js"></script><script src="../shared/core.js"></script><script src="app.js"></script></body></html>
