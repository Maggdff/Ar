name: Build APK from ZIP

# Put this file in your repo at:  .github/workflows/build.yml
# Then upload the project .zip to the repo root (any name, e.g. OcrPdfArabic_fixed.zip).
# The workflow unzips it, finds the Gradle project inside, and builds app-release.apk.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        id: unzip
        run: |
          set -e
          ZIP="$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            rm -rf _src && mkdir _src
            unzip -q -o "$ZIP" -d _src
            SEARCH=_src
          else
            echo "No .zip in repo root; looking for an already-extracted project"
            SEARCH=.
          fi
          SETTINGS="$(find "$SEARCH" -name 'settings.gradle.kts' -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. Upload the project zip to the repo root."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project dir: $DIR"
          chmod +x "$DIR/gradlew"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (does not block the APK build)
        continue-on-error: true
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect app-release.apk only
        run: |
          mkdir -p out
          APK="$(find "${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/release" -name 'app-release.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::app-release.apk not found"; exit 1; fi
          cp "$APK" out/app-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.apk
          if-no-files-found: error
